name: the_system
description: "The System — a personal lifestyle, fitness, habits and time-management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database (persistence)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  flutter_slidable: ^3.1.1
  percent_indicator: ^4.2.3

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  collection: ^1.18.0
  url_launcher: ^6.3.0

  # AI (Gemini), photo capture, calendar integration — see enhancement plan
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  device_calendar: ^4.3.2
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2C4238"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#2C4238"
  image: "assets/icon/icon.png"
  android_12:
    color: "#2C4238"
    image: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - .env
